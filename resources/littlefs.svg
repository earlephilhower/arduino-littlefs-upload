  <!-- Pins left -->
  <line x1="1" y1="5.5" x2="4" y2="5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="1" y1="9" x2="4" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="1" y1="12.5" x2="4" y2="12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="20" y1="5.5" x2="23" y2="5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
